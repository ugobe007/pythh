name: Funding Evidence Search

on:
  workflow_dispatch:
    inputs:
      limit:
        description: Startups to search (qualified+url cohort)
        required: false
        default: '400'
  schedule:
    # Every 20 minutes — continual drain toward 5000 resolved qualified startups
    - cron: '3,23,43 * * * *'

concurrency:
  group: funding-evidence-search
  cancel-in-progress: false

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # recover / triage / promote need DATABASE_URL (session pooler). If the secret is empty,
      # the agent auto-skips those pg steps and still runs ontology search via Supabase.
      # Set secrets.DATABASE_URL (and optionally PYTHH_REVIEWER_USER_ID) for the full loop.
      - name: Continual match-outcome loop (recover URLs → triage → promote → search)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PYTHH_REVIEWER_USER_ID: ${{ secrets.PYTHH_REVIEWER_USER_ID }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          BATCH_LIMIT: ${{ inputs.limit || '400' }}
        run: npm run outcomes:agent -- --apply --limit="$BATCH_LIMIT" --delay=400
